name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  VERSAO_PYTHON: "3.13"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint-and-test:
    name: Lint e Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.VERSAO_PYTHON }}
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Lint (flake8)
        run: flake8 app.py test_app.py --max-line-length=100
      - name: Testes (pytest)
        run: pytest -v

  security-scans:
    name: Segurança (Secrets, SAST, SCA)
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # histórico completo: o TruffleHog varre todos os commits

      # 1) Secret Scanning
      - name: Secret Scanning (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.VERSAO_PYTHON }}
      - name: Instalar dependências
        run: pip install -r requirements.txt

      # 2) SAST
      - name: SAST (Bandit)
        run: bandit -r app.py

      # 3) SCA
      - name: SCA (pip-audit)
        run: pip-audit -r requirements.txt

  build-and-push:
    name: Build, Trivy e Push (GHCR)
    runs-on: ubuntu-latest
    needs: [lint-and-test, security-scans]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build da imagem (local, para o scan)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: fastorder-api:scan

      - name: Diagnóstico (onde está o setuptools 70.3.0?)
        run: |
          docker run --rm --entrypoint sh fastorder-api:scan -c "find / -iname '*setuptools*' -not -path '/proc/*' -not -path '/sys/*' 2>/dev/null | head -50; echo '--- SBOM ---'; find / \( -name '*.cdx.json' -o -name '*.spdx*' -o -name 'sbom*' \) -not -path '/proc/*' -not -path '/sys/*' 2>/dev/null | head -20; echo '--- pip list ---'; pip list 2>/dev/null | grep -i setuptools"

      - name: Scan da imagem (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: fastorder-api:scan
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Login no GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push da imagem
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
